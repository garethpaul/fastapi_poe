name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  precommit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up latest Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up latest Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - uses: jakebailey/pyright-action@6baf8b2bcc1727b5a89249955f936d4a6f9f995b # v1

  openapi-artifacts:
    name: OpenAPI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Generate twice from outside the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openapi-first" "$RUNNER_TEMP/openapi-second"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/docs/generate_openapi_spec.py" \
            --json-output "$RUNNER_TEMP/openapi-first/openapi.json" \
            --markdown-output "$RUNNER_TEMP/openapi-first/openapi_endpoints.md"
          python "$GITHUB_WORKSPACE/docs/generate_openapi_spec.py" \
            --json-output "$RUNNER_TEMP/openapi-second/openapi.json" \
            --markdown-output "$RUNNER_TEMP/openapi-second/openapi_endpoints.md"
          cmp "$RUNNER_TEMP/openapi-first/openapi.json" \
            "$RUNNER_TEMP/openapi-second/openapi.json"
          cmp "$RUNNER_TEMP/openapi-first/openapi_endpoints.md" \
            "$RUNNER_TEMP/openapi-second/openapi_endpoints.md"

  tests:
    name: unit tests
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/
